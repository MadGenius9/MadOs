# MadOS CI.
#
#   checks  every push/PR: fmt, clippy, unit + D-Bus integration tests, config
#           validation, reproducibility check, VM-harness self-test.
#   image   pushes to master and manual runs: builds the bootable container,
#           converts it to qcow2, boots it under KVM and runs the smoke test.
#           Optionally builds the experimental installer ISO.
#
# Nothing is published: artifacts are smoke-test results and checksums (the
# disk image only when requested on a manual run).

name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_iso:
        description: Also build the experimental installer ISO
        type: boolean
        default: false
      upload_disk:
        description: Upload the qcow2 disk image as an artifact (several GB)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libgtk-4-dev libdbus-1-dev libpulse-dev pkg-config dbus shellcheck \
            pulseaudio pulseaudio-utils \
            librsvg2-bin desktop-file-utils libxml2-utils \
            qemu-system-x86 qemu-utils ovmf busybox-static cpio file

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check product metadata
        run: python3 scripts/product.py validate

      - name: make test
        run: make test

      - name: Reproducibility check (staged tree)
        run: sh scripts/repro-check.sh

  image:
    needs: checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - name: Install VM tooling
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            podman qemu-system-x86 qemu-utils ovmf openssl imagemagick

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check prerequisites
        run: make setup || true

      - name: Build bootable container image
        run: make image

      - name: Build qcow2 disk image
        run: make disk

      - name: Smoke test (boot, session, network, reboot, shutdown)
        run: make smoke

      - name: Smoke highlights (readable from the job log)
        if: always()
        run: |
          if [ -f out/smoke/serial.log ]; then
            echo "--- boot markers and key console lines"
            grep -a -E "MADOS_|Welcome to|SELinux|Reached target Graphical|Failed to start" out/smoke/serial.log | cut -c1-200 | head -60 || true
          fi
          if [ -f out/smoke/screen.png ] && command -v convert >/dev/null; then
            convert out/smoke/screen.png -resize 640x -quality 60 out/smoke/thumb.jpg
            echo "::group::screenshot thumbnail (base64 JPEG, 76-column lines)"
            sha256sum out/smoke/thumb.jpg
            base64 -w 76 out/smoke/thumb.jpg
            echo "::endgroup::"
          fi

      - name: Build installer ISO (experimental)
        if: github.event_name == 'workflow_dispatch' && inputs.build_iso
        run: make iso

      - name: Install from the ISO and boot the result (experimental)
        if: github.event_name == 'workflow_dispatch' && inputs.build_iso
        run: |
          sudo apt-get install -y -q --no-install-recommends xorriso dosfstools mtools
          rm -f out/*.qcow2
          make iso-test

      - name: ISO install highlights
        if: always() && github.event_name == 'workflow_dispatch' && inputs.build_iso
        run: |
          for f in out/iso-install/serial.log out/iso-install/boot/serial.log; do
            [ -f "$f" ] || continue
            echo "--- $f"
            grep -a -E "MADOS_|anaconda|Installing|Traceback|error|Error|Welcome to" "$f" | cut -c1-200 | tail -60 || true
          done
          shot=$(ls out/iso-install/boot/screen.* 2>/dev/null | head -n 1)
          if [ -n "$shot" ] && command -v convert >/dev/null; then
            convert "$shot" -resize 640x -quality 60 out/iso-install/boot/thumb.jpg
            echo "::group::installed system screenshot thumbnail (base64 JPEG, 76-column lines)"
            sha256sum out/iso-install/boot/thumb.jpg
            base64 -w 76 out/iso-install/boot/thumb.jpg
            echo "::endgroup::"
          fi

      - name: Collect results
        if: always()
        run: |
          mkdir -p results
          cp out/*.sha256 out/build-id out/image-ref results/ 2>/dev/null || true
          cp out/smoke/report.json out/smoke/serial.log out/smoke/qemu.log \
             out/smoke/screen.* results/ 2>/dev/null || true
          if [ -d out/iso-install ]; then
            mkdir -p results/iso-install
            cp out/iso-install/serial.log results/iso-install/install-serial.log 2>/dev/null || true
            cp out/iso-install/boot/serial.log results/iso-install/boot-serial.log 2>/dev/null || true
            cp out/iso-install/boot/report.json out/iso-install/boot/screen.* results/iso-install/ 2>/dev/null || true
          fi
          ls -la results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mados-smoke-${{ github.run_number }}
          path: results/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.upload_disk
        with:
          name: mados-disk-${{ github.run_number }}
          path: |
            out/*.qcow2
            out/*.qcow2.sha256
          retention-days: 3
          compression-level: 6
