# mcelog only supports Intel CPUs; on AMD (family 17h and later) it exits with
# an error and the system boots "degraded". Run it only on Intel; elsewhere
# the unit is skipped (AMD machine-check reporting uses the kernel's EDAC
# drivers). Harmless when mcelog is not installed.
[Service]
ExecCondition=/usr/libexec/mados/is-intel-cpu
