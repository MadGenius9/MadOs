# Restore the SELinux labels of the account database at every boot (type z:
# relabel only; mode, owner and group are left as they are; missing files are
# skipped).
#
# Anaconda creates the first user while installing from the ISO and leaves
# /etc/.pwd.lock labelled etc_t instead of shadow_t. With SELinux enforcing,
# systemd's DynamicUser= setup then cannot take the lock and
# rpm-ostreed.service fails ("Failed to update dynamic user credentials:
# Permission denied"; CI run #15: avc denied { write } name=".pwd.lock"
# scontext=init_t tcontext=etc_t). Disk images built with image-builder are
# not affected; the rule is a no-op there.
z /etc/.pwd.lock - - - -
z /etc/passwd    - - - -
z /etc/group     - - - -
z /etc/shadow    - - - -
z /etc/gshadow   - - - -
z /etc/subuid    - - - -
z /etc/subgid    - - - -
