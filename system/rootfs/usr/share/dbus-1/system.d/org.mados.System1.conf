<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the name. Anyone may call it: privileged methods are
     authorized per call with polkit inside mados-daemon. -->
<busconfig>
  <policy user="root">
    <allow own="org.mados.System1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.mados.System1" send_interface="org.mados.System1"/>
    <allow send_destination="org.mados.System1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.mados.System1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.mados.System1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
