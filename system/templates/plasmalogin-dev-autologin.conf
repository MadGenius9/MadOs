# DEVELOPMENT IMAGES ONLY. Logs the development user straight into Plasma so
# VM smoke tests can verify the graphical session. Fedora 44 KDE uses Plasma
# Login Manager (not SDDM) as display manager; it reads
# /etc/plasmalogin.conf.d/. Never shipped in release images
# (scripts/stage-system.py --variant release). See docs/security.md.
[Autologin]
User=@DEV_USER@
Session=plasma
Relogin=false
